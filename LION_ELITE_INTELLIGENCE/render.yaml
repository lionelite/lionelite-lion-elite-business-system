services:
  - type: keyvalue
    name: lion-elite-agent-bus
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lion-elite-intelligence
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_ADDRESS
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary

  - type: worker
    name: lion-elite-intelligence-worker
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM_ADDRESS
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: AUTONOMOUS_SENDING_ENABLED
        value: "false"
      - key: OUTREACH_START_HOUR
        value: "7"
      - key: OUTREACH_END_HOUR
        value: "18"
      - key: OUTREACH_WEEKDAYS_ONLY
        value: "true"
      - key: DAILY_SEND_LIMIT
        value: "25"
      - key: SEND_BATCH_SIZE
        value: "5"
      - key: WORKER_INTERVAL_MINUTES
        value: "15"
      - key: MAX_FOLLOW_UPS
        value: "2"
      - key: REQUIRE_VERIFIED_PUBLIC_EMAIL
        value: "true"
      - key: ALLOWED_SOURCE_DOMAINS
        sync: false
      - key: GMAIL_PROCESSED_LABEL_ID
        sync: false

  - type: worker
    name: lion-elite-agent-worker
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.agent_runtime.celery_app worker --loglevel=INFO --concurrency=2 --prefetch-multiplier=1
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_SOFT_TIME_LIMIT
        value: "240"
      - key: AGENT_HARD_TIME_LIMIT
        value: "280"
      - key: AGENT_STALE_MINUTES
        value: "5"

  - type: worker
    name: lion-elite-agent-heartbeat
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.agent_runtime.celery_app beat --loglevel=INFO
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString

databases:
  - name: lion-elite-intelligence-db
    plan: starter
    databaseName: lion_elite_intelligence
    user: lion_elite_intelligence
