services:
  - type: keyvalue
    name: lion-elite-agent-bus
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lion-elite-intelligence
    runtime: docker
    plan: free
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: IN_PROCESS_AGENT_RUNTIME
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_STALE_MINUTES
        value: "5"
      - key: AUTONOMOUS_SENDING_ENABLED
        value: "false"

databases:
  - name: lion-elite-intelligence-db
    plan: free
    databaseName: lion_elite_intelligence
    user: lion_elite_intelligence
