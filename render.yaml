services:
  - type: keyvalue
    name: lion-elite-agent-bus
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lion-elite-intelligence
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: IN_PROCESS_AGENT_RUNTIME
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_STALE_MINUTES
        value: "5"
      - key: AUTONOMOUS_SENDING_ENABLED
        value: "false"
      # Gates POST /ingest/leads and the campaign write endpoints. Absent, those
      # return 503 rather than accepting unauthenticated writes — fail closed,
      # but invisible from the blueprint unless the variable is declared here.
      - key: LEI_ADMIN_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID
        sync: false
      - key: STRIPE_SCALE_PRICE_ID
        sync: false

  - type: worker
    name: lion-elite-agent-community
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.agent_runtime.celery_app worker --beat --loglevel=INFO --concurrency=2 --prefetch-multiplier=1
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_SOFT_TIME_LIMIT
        value: "240"
      - key: AGENT_HARD_TIME_LIMIT
        value: "280"
      - key: AGENT_STALE_MINUTES
        value: "5"
      - key: IN_PROCESS_AGENT_RUNTIME
        value: "true"

  # BuildPipeline — the SDR front end. Previously in no blueprint at all, which
  # is why buildpipeline.online has never pointed anywhere: there was nothing
  # deployed to point it at.
  #
  # Separate service rather than folded into lion-elite-intelligence because
  # they are different runtimes (Node/Next vs Python/Docker) and should scale
  # and fail independently — an SDR UI being down must not take the CRM with it.
  - type: web
    name: buildpipeline
    runtime: node
    plan: starter
    rootDir: buildpipeline
    buildCommand: npm ci && npm run build
    # Render assigns the port; next start defaults to 3000 and would bind the
    # wrong one, so it is passed explicitly.
    startCommand: npx next start -p $PORT
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base URL of the CRM. Deliberately not derived with fromService: Render
      # supplies host and port separately and the blueprint cannot concatenate
      # them into a URL, so a wrong guess here would fail at runtime rather
      # than at deploy. Set it to the internal address of
      # lion-elite-intelligence.
      - key: CRM_API_BASE
        sync: false
      # Must equal LEI_ADMIN_API_KEY on lion-elite-intelligence. Secret, so it
      # is set in the dashboard and never committed.
      - key: CRM_ADMIN_KEY
        sync: false
      # Numeric id of the workspace this deployment writes to. The CRM refuses
      # a batch naming an unknown organization rather than writing rows that
      # belong to nobody.
      - key: CRM_ORGANIZATION_ID
        sync: false

databases:
  - name: lion-elite-intelligence-db
    plan: starter
    databaseName: lion_elite_intelligence
    user: lion_elite_intelligence
