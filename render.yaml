services:
  - type: keyvalue
    name: lion-elite-agent-bus
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: lion-elite-intelligence
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: IN_PROCESS_AGENT_RUNTIME
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_STALE_MINUTES
        value: "5"
      - key: AUTONOMOUS_SENDING_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID
        sync: false
      - key: STRIPE_SCALE_PRICE_ID
        sync: false

  - type: worker
    name: lion-elite-agent-community
    runtime: docker
    plan: starter
    rootDir: LION_ELITE_INTELLIGENCE
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.agent_runtime.celery_app worker --beat --loglevel=INFO --concurrency=2 --prefetch-multiplier=1
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-elite-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lion-elite-agent-bus
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AGENT_SOFT_TIME_LIMIT
        value: "240"
      - key: AGENT_HARD_TIME_LIMIT
        value: "280"
      - key: AGENT_STALE_MINUTES
        value: "5"
      - key: IN_PROCESS_AGENT_RUNTIME
        value: "true"

databases:
  - name: lion-elite-intelligence-db
    plan: starter
    databaseName: lion_elite_intelligence
    user: lion_elite_intelligence
